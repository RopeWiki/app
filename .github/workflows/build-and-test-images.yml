name: Build and Test Images

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '17 6 * * 5'   # Fridays at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-image-publishing-policy:
    name: Test Image Publishing Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run unit tests
        run: |
          node --test .github/tests/image-policy.test.cjs
          python3 -m unittest discover -s .github/tests -p 'test_*.py'

  build-and-test-images:
    name: Build and Test Images
    needs: test-image-publishing-policy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    env:
      WG_DB_PASSWORD: "NotReal"
      RW_ROOT_DB_PASSWORD: "NotReal"
      RW_SMTP_USERNAME: "NotReal"
      RW_SMTP_PASSWORD: "NotReal"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify Docker installation
        run: docker --version

      - name: Create mount directories
        run: mkdir -p /home/runner/work/app/mount/{sqlbackup,images,proxy_config}

      - name: Build containers
        run: ./deploy_tool.py github dc -- build --no-cache --pull

      - name: Create mysql database
        run: ./deploy_tool.py github create_db

      - name: Restore empty mediawiki schema
        run: echo y | ./deploy_tool.py github restore_empty_db

      - name: Start the containers
        run: ./deploy_tool.py github start_site

      # The empty mediawiki schema file isn't always up-to-date, so run a schema upgrade just in case.
      - name: Run maintenance update
        run: ./deploy_tool.py github dc exec ropewiki_webserver "/rw/maintenance/update.php --quick"

      - name: Verify site is accessible
        run: |
          curl -s http://localhost/Main_Page | grep -q "This is a blank copy of ropewiki"
          if [ $? -eq 0 ]; then
            echo "Site verification successful!"
          else
            echo "Site verification failed - expected string not found"
            exit 1
          fi
      # This runner executes contributor code and must never receive registry secrets.
      - name: Export tested images
        env:
          IMAGE_ARCHIVES: ${{ runner.temp }}/tested-images
        run: |
          set -euo pipefail
          mkdir -p "$IMAGE_ARCHIVES"
          for image in backup_manager database mailserver reverse_proxy webserver; do
            docker image save "ropewiki/$image:latest" | gzip -1 > "$IMAGE_ARCHIVES/$image.tar.gz"
          done

      - name: Upload tested images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tested-images/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
